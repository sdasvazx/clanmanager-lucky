spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/clanmanager?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:112200}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:change-this-development-secret-at-least-32-characters}
    access-lifetime: ${AUTH_ACCESS_LIFETIME:PT30M}
    refresh-lifetime: ${AUTH_REFRESH_LIFETIME:P30D}
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}
    same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
    max-age: ${AUTH_COOKIE_MAX_AGE:P30D}

watch:
  api-key: ${WATCH_API_KEY:}

discord:
  webhook-url: ${DISCORD_WEBHOOK_URL:}
  bot-token: ${DISCORD_BOT_TOKEN:}
